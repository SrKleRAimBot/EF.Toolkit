name: Release

# Publishes to nuget.org via Trusted Publishing (OIDC) — no stored API key.
# The matching policy lives on nuget.org and is keyed to this file's name.
#
# Cut a release by tagging master, e.g.
#   git tag v10.0.0-alpha.1 && git push origin v10.0.0-alpha.1
#
# The tag is a trigger, not the source of truth: the version comes from
# Directory.Build.props, and a tag that disagrees with it fails the run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack, but do not push'
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for the OIDC token exchange
      contents: read

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

      - name: Unit tests (bulk)
        run: dotnet test tests/EF.Toolkit.Bulk.Tests -c Release --no-build --verbosity normal

      - name: Unit tests (audit)
        run: dotnet test tests/EF.Toolkit.Audit.Tests -c Release --no-build --verbosity normal

      # The differential harnesses are the primary correctness gate, so a release runs them
      # rather than trusting that the tagged commit was already validated on a branch.
      - name: Equivalence tests (bulk)
        run: dotnet test tests/EF.Toolkit.Bulk.Equivalence -c Release --no-build --verbosity normal

      - name: Equivalence tests (audit)
        run: dotnet test tests/EF.Toolkit.Audit.Equivalence -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      # Guards against tagging v1.2.3 while the props still say something else, which would
      # otherwise publish a version nobody asked for.
      - name: Verify tag matches packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          packed=$(ls artifacts/EF.Toolkit.Bulk.*.nupkg \
            | grep -v -E '\.(SqlServer|PostgreSQL)\.' \
            | sed -E 's|.*/EF\.Toolkit\.Bulk\.(.+)\.nupkg|\1|')
          echo "tag=$tag packed=$packed"
          if [ "$tag" != "$packed" ]; then
            echo "::error::Tag v$tag does not match packaged version $packed (set in Directory.Build.props)."
            exit 1
          fi

      - name: List packages
        run: ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # Exchanged just before the push: the temporary key is valid for one hour.
      - name: NuGet login (OIDC -> temporary API key)
        if: github.event_name == 'push' || inputs.dry_run == false
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Each core package goes before its dependents, so they resolve against something already
      # accepted, and the bridge goes last because it depends on both cores. --skip-duplicate keeps
      # a re-run after a partial failure safe.
      - name: Push
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          set -euo pipefail
          feed=https://api.nuget.org/v3/index.json
          for pkg in \
            artifacts/EF.Toolkit.Bulk.[0-9]*.nupkg \
            artifacts/EF.Toolkit.Bulk.SqlServer.*.nupkg \
            artifacts/EF.Toolkit.Bulk.PostgreSQL.*.nupkg \
            artifacts/EF.Toolkit.Audit.[0-9]*.nupkg \
            artifacts/EF.Toolkit.Audit.SqlServer.*.nupkg \
            artifacts/EF.Toolkit.Audit.PostgreSQL.*.nupkg \
            artifacts/EF.Toolkit.Audit.Bulk.*.nupkg
          do
            echo "::group::push $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source "$feed" \
              --skip-duplicate
            echo "::endgroup::"
          done
