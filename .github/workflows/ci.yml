name: CI

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Unit tests (bulk)
        run: dotnet test tests/EF.Toolkit.Bulk.Tests -c Release --no-build --verbosity normal
      - name: Unit tests (audit)
        run: dotnet test tests/EF.Toolkit.Audit.Tests -c Release --no-build --verbosity normal
      - name: Unit tests (query)
        run: dotnet test tests/EF.Toolkit.Query.Tests -c Release --no-build --verbosity normal
      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  equivalence:
    # The differential harnesses are the primary correctness gate. The bulk suite runs each scenario
    # against stock EF and against EF.Toolkit.Bulk on real engines and asserts the database contents
    # and change-tracker state match; the audit suite runs the same change through SaveChanges and
    # through the explicit bulk API and asserts the audit entries are identical; the query suite
    # walks a result set by keyset and by offset and asserts both cover every row exactly once. All
    # three need Docker, so they are a separate job.
    name: Equivalence (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlserver, postgres16, postgres17]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Equivalence tests (bulk)
        run: >
          dotnet test tests/EF.Toolkit.Bulk.Equivalence -c Release --no-build --verbosity normal
          --filter "Engine=${{ matrix.engine }}"
      - name: Equivalence tests (audit)
        run: >
          dotnet test tests/EF.Toolkit.Audit.Equivalence -c Release --no-build --verbosity normal
          --filter "Engine=${{ matrix.engine }}"
      - name: Equivalence tests (query)
        run: >
          dotnet test tests/EF.Toolkit.Query.Equivalence -c Release --no-build --verbosity normal
          --filter "Engine=${{ matrix.engine }}"
