name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/EF.Bulk.Tests -c Release --no-build --verbosity normal
      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  equivalence:
    # The differential harness is the primary correctness gate: it runs each scenario against
    # stock EF and against EF.Bulk on real engines, then asserts the database contents and the
    # change-tracker state match. It needs Docker, so it is a separate job.
    name: Equivalence (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlserver, postgres16, postgres17]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Equivalence tests
        run: >
          dotnet test tests/EF.Bulk.Equivalence -c Release --no-build --verbosity normal
          --filter "Engine=${{ matrix.engine }}"
